name: Guard protected branches

on:
  push:
    branches:
      - Boilerplate
      - main

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    # Only trigger if the pusher is NOT the authorized owner
    if: github.actor != 'ranjithravi_microsoft'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert unauthorized push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert HEAD --no-edit
          git push origin ${{ github.ref_name }}

      - name: Notify in commit message
        run: |
          echo "⚠️ Unauthorized push to ${{ github.ref_name }} by ${{ github.actor }} was automatically reverted."
          echo "Only ranjithravi_microsoft can push to this branch directly."
          echo "Please create a feature branch (e.g. yourname/feature-name) and push there instead."
