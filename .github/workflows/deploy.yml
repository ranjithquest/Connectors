name: Deploy to GitHub Pages

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deploy path
        id: path
        run: |
          if [ "${{ github.ref_name }}" = "Boilerplate" ]; then
            echo "basepath=/connectors" >> $GITHUB_OUTPUT
            echo "deploydir=connectors" >> $GITHUB_OUTPUT
            echo "previewurl=https://studious-adventure-j17vp6o.pages.github.io/connectors" >> $GITHUB_OUTPUT
          else
            SLUG=$(echo "${{ github.ref_name }}" | sed 's|^bp/||' | tr '[:upper:]' '[:lower:]')
            echo "basepath=/connectors/${SLUG}" >> $GITHUB_OUTPUT
            echo "deploydir=connectors/${SLUG}" >> $GITHUB_OUTPUT
            echo "previewurl=https://studious-adventure-j17vp6o.pages.github.io/connectors/${SLUG}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.path.outputs.basepath }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: ${{ steps.path.outputs.deploydir }}
          keep_files: true

      - name: Print preview URL
        run: echo "Preview URL ${{ steps.path.outputs.previewurl }}"
