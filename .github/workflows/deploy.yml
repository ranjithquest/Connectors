name: Deploy to GitHub Pages

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deploy path
        id: path
        run: |
          if [ "${{ github.ref_name }}" = "Boilerplate" ]; then
            echo "basepath=/connectors" >> $GITHUB_OUTPUT
            echo "deploydir=connectors" >> $GITHUB_OUTPUT
            echo "previewurl=https://studious-adventure-j17vp6o.pages.github.io/connectors" >> $GITHUB_OUTPUT
          else
            SLUG=$(echo "${{ github.ref_name }}" | sed 's|^bp/||' | tr '[:upper:]' '[:lower:]')
            echo "basepath=/connectors/${SLUG}" >> $GITHUB_OUTPUT
            echo "deploydir=connectors/${SLUG}" >> $GITHUB_OUTPUT
            echo "previewurl=https://studious-adventure-j17vp6o.pages.github.io/connectors/${SLUG}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.path.outputs.basepath }}

      - name: Restructure output for deployment
        run: |
          DEPLOYDIR="${{ steps.path.outputs.deploydir }}"

          # Move _next assets inside the deploydir so relative paths work correctly
          # Next.js references assets as /<basepath>/_next/... so they must live inside deploydir
          mv out/_next out/${DEPLOYDIR}/_next

          # Copy all public files and directories from out/ root into deploydir
          # These are referenced as /<basepath>/... in the app (logos/, icons, images, SVGs etc.)
          for item in out/*; do
            name=$(basename "$item")
            if [ "$name" != "_next" ] && [ "$name" != "${DEPLOYDIR}" ]; then
              cp -r "$item" out/${DEPLOYDIR}/
            fi
          done

          # Save the deploydir contents to temp
          cp -r out/${DEPLOYDIR} /tmp/deploy-out

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to gh-pages branch (create orphan if it doesn't exist)
          git fetch origin gh-pages 2>/dev/null && git checkout gh-pages || (git checkout --orphan gh-pages && git rm -rf . --quiet)

          # Remove old content for this deploy path only, keep everything else
          rm -rf ${{ steps.path.outputs.deploydir }}

          # Copy new build output into the correct subfolder
          mkdir -p ${{ steps.path.outputs.deploydir }}
          cp -r /tmp/deploy-out/. ${{ steps.path.outputs.deploydir }}/

          # Add root index.html redirect if it doesn't exist
          if [ ! -f index.html ]; then
            echo '<meta http-equiv="refresh" content="0; url=/connectors">' > index.html
            git add index.html
          fi

          # Commit and push
          git add ${{ steps.path.outputs.deploydir }}
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Deploy ${{ github.ref_name }} to ${{ steps.path.outputs.deploydir }}"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print preview URL
        run: echo "Preview URL ${{ steps.path.outputs.previewurl }}"
