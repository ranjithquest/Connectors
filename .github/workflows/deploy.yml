name: Deploy to GitHub Pages

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deploy path
        id: path
        run: |
          if [ "${{ github.ref_name }}" = "Boilerplate" ]; then
            echo "basepath=" >> $GITHUB_OUTPUT
            echo "deploydir=." >> $GITHUB_OUTPUT
            echo "previewurl=https://studious-adventure-j17vp6o.pages.github.io/connectors" >> $GITHUB_OUTPUT
          else
            SLUG=$(echo "${{ github.ref_name }}" | sed 's|^bp/||' | tr '[:upper:]' '[:lower:]')
            echo "basepath=/connectors/${SLUG}" >> $GITHUB_OUTPUT
            echo "deploydir=connectors/${SLUG}" >> $GITHUB_OUTPUT
            echo "previewurl=https://studious-adventure-j17vp6o.pages.github.io/connectors/${SLUG}/connectors" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.path.outputs.basepath }}

      - name: Deploy to gh-pages branch
        run: |
          DEPLOYDIR="${{ steps.path.outputs.deploydir }}"

          if [ "$DEPLOYDIR" != "." ]; then
            # Feature branch: move _next inside deploydir, copy public files
            mv out/_next out/${DEPLOYDIR}/_next
            for item in out/*; do
              name=$(basename "$item")
              if [ "$name" != "_next" ] && [ "$name" != "connectors" ]; then
                cp -r "$item" out/${DEPLOYDIR}/
              fi
            done
          fi

          # Save built output to temp
          cp -r out /tmp/deploy-out

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to gh-pages branch (create orphan if it doesn't exist)
          git fetch origin gh-pages 2>/dev/null && git checkout gh-pages || (git checkout --orphan gh-pages && git rm -rf . --quiet)

          if [ "$DEPLOYDIR" = "." ]; then
            # Boilerplate: replace entire site
            git rm -rf . --quiet 2>/dev/null || true
            cp -r /tmp/deploy-out/out/. .
          else
            # Feature branch: only update the feature subfolder
            rm -rf ${DEPLOYDIR}
            mkdir -p ${DEPLOYDIR}
            cp -r /tmp/deploy-out/out/${DEPLOYDIR}/. ${DEPLOYDIR}/
          fi

          # Add root index.html redirect if it doesn't exist
          if [ ! -f index.html ]; then
            echo '<meta http-equiv="refresh" content="0; url=/connectors">' > index.html
          fi

          git add -A
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Deploy ${{ github.ref_name }}"
          git push origin gh-pages

      - name: Print preview URL
        run: echo "Preview URL ${{ steps.path.outputs.previewurl }}"
